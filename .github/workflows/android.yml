name: APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sürüm = commit sayısı

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Repo Gradle 8.5 istiyor (AGP 8.2); runner'daki Gradle 9.x patlatıyor.
      - name: Install Gradle 8.5
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - run: /tmp/gradle-8.5/bin/gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: damen-asistan-apk
          path: app/build/outputs/apk/debug/*.apk
